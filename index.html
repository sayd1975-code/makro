var MAPA = [
  ["Otwory równo na kole (PCD)", "L900", "R28 = 130 (zakładowy)"],
  ["Otwory w rzędzie po prostej", "L906", "R25 = kąt linii"],
  ["Kieszeń prostokątna (jak L316/L318)", "L903", "R3 = dno: -15 / -28 z hali"],
  ["Kieszeń okrągła (gniazda)", "L930", "kieszeń > frez + 2 mm"],
  ["Powiększyć gotowy otwór", "L931", "najpierw przewierć (R25), potem rozszerz (R24)"],
  ["Rowek promieniowy, wąski", "L902", "R13 = długość (mm)"],
  ["Rowek promieniowy, szeroki", "L901", "frez < 0,45 × szerokość"],
  ["Szczelina na okręgu, wąska", "L905", "R13 = KĄT, nie mm!"],
  ["Szczelina na okręgu, szeroka", "L904", "frez < 0,45 × szerokość"],
  ["Pełny pierścień (o-ring!)", "L904", "R27=1, R13=360 🎯"]
];

// ================= STAN =================
var LS_KEY = "makrocykle-vals-v1";
var tab = "mapa";
var sel = "L903";
var vals = (function () {
  var d = { D: "1" };
  MACROS.forEach(function (m) {
    m.fields.forEach(function (f) { d[m.id + "|" + f.r] = f.def; });
  });
  try {
    var s = localStorage.getItem(LS_KEY);
    if (s) {
      var saved = JSON.parse(s);
      Object.keys(d).forEach(function (k) { if (saved[k] !== undefined) d[k] = saved[k]; });
    }
  } catch (e) {}
  return d;
})();

function saveVals() {
  try { localStorage.setItem(LS_KEY, JSON.stringify(vals)); } catch (e) {}
}
function fmt(s) { return String(s === undefined || s === null ? "" : s).trim().replace(",", "."); }
function vOf(m) {
  var v = {};
  m.fields.forEach(function (f) { v[f.r] = fmt(vals[m.id + "|" + f.r]); });
  v.D = fmt(vals.D);
  return v;
}
function currentMacro() {
  for (var i = 0; i < MACROS.length; i++) if (MACROS[i].id === sel) return MACROS[i];
  return MACROS[0];
}
function codeOf(m) { return m.gen(vOf(m)).join("\n"); }
function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }

// ================= AKCJE =================
function setTab(t) { tab = t; render(); }
function selectMacro(id) { sel = id; setTab("gen"); }
function openMacro(id, patch) {
  if (patch) { for (var k in patch) vals[k] = patch[k]; saveVals(); }
  selectMacro(id);
}
function setVal(key, value) { vals[key] = value; saveVals(); refreshCode(); }
function applyRing() {
  vals[sel + "|R27"] = "1";
  vals[sel + "|R13"] = "360";
  saveVals();
  render();
}
function resetMacro() {
  var m = currentMacro();
  m.fields.forEach(function (f) { vals[m.id + "|" + f.r] = f.def; });
  saveVals();
  render();
}
function copyCode() {
  var txt = codeOf(currentMacro());
  function done() {
    var b = document.getElementById("copy-btn");
    if (b) { b.textContent = "Skopiowane ✅"; setTimeout(function () { b.textContent = "📋 Kopiuj"; }, 1600); }
  }
  function fallback() {
    try {
      var ta = document.createElement("textarea");
      ta.value = txt;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand("copy");
      document.body.removeChild(ta);
      done();
    } catch (e) {}
  }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(txt).then(done, fallback);
  } else { fallback(); }
}

// ================= RENDER =================
function render() {
  var nav = document.getElementById("nav");
  var tabs = [["mapa", "🗺️ Mapa"], ["gen", "⚙️ Generator"], ["abc", "🔤 R-ki"], ["blok", "🛑 Blokady"]];
  nav.innerHTML = tabs.map(function (t) {
    return '<button class="tab' + (tab === t[0] ? " active" : "") + '" onclick="setTab(\'' + t[0] + '\')">' + t[1] + "</button>";
  }).join("");

  var v = document.getElementById("view");
  if (tab === "mapa") v.innerHTML = viewMapa();
  else if (tab === "gen") v.innerHTML = viewGen();
  else if (tab === "abc") v.innerHTML = viewAbc();
  else v.innerHTML = viewBlok();
  window.scrollTo(0, 0);
}

function viewMapa() {
  var h = '<p class="muted">Klikasz zadanie → apka otwiera generator z gotowymi wartościami. Zmieniasz wymiary, kopiujesz program.</p>';
  h += MAPA.map(function (row) {
    var m = null;
    MACROS.forEach(function (x) { if (x.id === row[1]) m = x; });
    var isRing = row[0].indexOf("pierścień") !== -1;
    var act = isRing
      ? "openMacro('L904', {'L904|R27':'1','L904|R13':'360'})"
      : "openMacro('" + row[1] + "')";
    return '<button class="mapa-item" onclick="' + act + '">' +
      '<span class="ico">' + m.icon + "</span>" +
      '<span><span class="t">' + esc(row[0]) + '</span><br><span class="id">' + row[1] + "</span></span>" +
      '<span class="note">' + esc(row[2]) + "</span></button>";
  }).join("");
  h += '<div class="card gold"><div class="gt">🥇 Złota zasada</div>' +
    "<p>Makrocykle <b>frezujące</b> wołają <b>D</b> z numerem korektora (np. <code class=\"amber\">L903 D1</code>) — tam siedzi promień freza. Bez D maszyna krzyknie <code class=\"amber\">PROMIEN FREZA &lt;= 0</code> i stanie.</p></div>";
  return h;
}

function viewGen() {
  var m = currentMacro();
  var h = '<div class="chips">' + MACROS.map(function (x) {
    return '<button class="chip' + (sel === x.id ? " active" : "") + '" onclick="selectMacro(\'' + x.id + '\')">' + x.icon + " " + x.id + "</button>";
  }).join("") + "</div>";

  h += '<div class="card"><div class="desc-title">' + m.icon + " " + m.id + " — " + esc(m.task) + "</div>" +
    '<p class="desc">' + esc(m.desc) + "</p>" +
    '<p class="hala">🏭 <b>Na hali:</b> ' + esc(m.hala) + "</p>";
  if (m.note) h += '<p class="warn">⚠️ ' + esc(m.note) + "</p>";
  if (m.trick) h += '<button class="btn btn-trick" onclick="applyRing()">🎯 Pełny pierścień: R27=1, R13=360</button>';
  h += '<div style="text-align:right;margin-top:10px"><button class="btn btn-reset" onclick="resetMacro()">↺ wartości domyślne</button></div>';
  h += "</div>";

  [K, G].forEach(function (grp) {
    h += '<div class="gtitle">' + grp + '</div><div class="card" style="padding:0">';
    m.fields.forEach(function (f) {
      if (f.group !== grp) return;
      var key = m.id + "|" + f.r;
      h += '<div class="frow"><span class="r">' + f.r + '</span><label>' + esc(f.label) + '</label>' +
        '<input inputmode="decimal" value="' + esc(vals[key] === undefined ? f.def : vals[key]) + '" oninput="setVal(\'' + key + '\', this.value)"></div>';
      if (f.hint) h += '<div class="hint" style="padding:0 12px 10px;margin-top:-8px">' + esc(f.hint) + "</div>";
    });
    if (grp === G && m.needsD) {
      h += '<div class="frow"><span class="r dred">D</span><label>Numer korektora promienia freza</label>' +
        '<input class="dred" inputmode="numeric" value="' + esc(vals.D) + '" oninput="setVal(\'D\', this.value)"></div>' +
        '<div class="hint" style="padding:0 12px 10px;margin-top:-8px">wymagane — bez tego maszyna stanie!</div>';
    }
    h += "</div>";
  });

  h += '<div class="codebox"><div class="bar"><span id="call-chip"></span>' +
    '<button class="btn btn-copy" id="copy-btn" onclick="copyCode()">📋 Kopiuj</button></div>' +
    '<pre id="code-pre"></pre></div>';
  h += '<p class="muted" style="padding-top:10px">Wstaw między narzędzie a M30. Pierwszy raz: skrawek, wolno, palec na feed override! 🔧</p>';
  return h;
}

function viewAbc() {
  var h = '<p class="muted">Uczysz się RAZ — wszystkie makrocykle używają tego samego alfabetu.</p><div class="card" style="padding:0">';
  h += ALFABET.map(function (a) {
    return '<div class="arow"><span class="r">' + a[0] + '</span><span class="d">' + esc(a[1]) + "</span></div>";
  }).join("");
  return h + "</div>";
}

function viewBlok() {
  var h = '<p class="muted">Co krzyczy maszyna → co poprawić. Tłumaczenie komunikatów po frezersku.</p><div class="card" style="padding:0">';
  h += BLOKADY.map(function (b) {
    return '<div class="brow"><div class="err">' + esc(b[0]) + '</div><div class="fix">→ ' + esc(b[1]) + "</div></div>";
  }).join("");
  h += "</div>";
  h += '<div class="card"><div class="desc-title">🔧 Bezpieczny start</div><ol class="safe">' +
    "<li>R2 = +5 nad detalem → łagodny zjazd</li>" +
    "<li>Pierwszy raz na skrawku, feed override w garści</li>" +
    "<li>R1 mały (5–10 mm) — dopiero potem zwiększaj</li>" +
    "<li>Przeszedł? Masz nowy robot na hali, za darmo, od 2014 roku 🍒</li></ol></div>";
  return h;
}

function refreshCode() {
  var m = currentMacro();
  var pre = document.getElementById("code-pre");
  var chip = document.getElementById("call-chip");
  if (pre) pre.textContent = codeOf(m);
  if (chip) chip.textContent = m.id + (m.needsD ? " D" + fmt(vals.D) : "") + " — gotowy program";
}

render();
refreshCode();
</script>
